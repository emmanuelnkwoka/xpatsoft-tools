name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} — syntax, tests, static checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:2

      - name: PHP version
        run: php -v

      - name: PHP syntax check (all plugin files)
        run: |
          status=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null || { echo "SYNTAX FAIL: $f"; php -l "$f"; status=1; }
          done < <(find . -path ./.git -prune -o -name '*.php' -print0)
          exit $status

      - name: PHP test runner
        run: php tests/run-tests.php

  js:
    name: Node — JS syntax, unit tests, regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JavaScript syntax check
        run: |
          status=0
          while IFS= read -r f; do
            node --check "$f" || { echo "JS SYNTAX FAIL: $f"; status=1; }
          done < <(find . -path ./.git -prune -o -name '*.js' -not -name '*.min.js' -print)
          exit $status

      - name: Unit tests (tool logic)
        run: node tests/run-js-tests.js

      - name: Regression & security tests
        run: node tests/run-regression-tests.js

      - name: PDF text-preservation verification
        run: |
          npm init -y > /dev/null 2>&1
          npm install --no-audit --no-fund pdf-lib@1.17.1 pdfjs-dist@3.11.174
          node tests/verify-pdf-text.js

  wordpress:
    name: WordPress integration (PHPUnit + WP test suite)
    runs-on: ubuntu-latest
    continue-on-error: true   # informational until the WP matrix is confirmed green
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, xml, curl, zip
          tools: composer:2, phpunit-polyfills

      - name: Install WordPress test suite
        run: |
          bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest

      - name: Prepare WP test config
        run: |
          if [ ! -f tests/wp-tests-config.php ]; then echo "No WP test config; skipping"; exit 0; fi

      - name: Run plugin unit tests under WordPress
        run: |
          if [ ! -f tests/wp-bootstrap.php ]; then
            echo "::warning::WordPress test bootstrap not present — integration tests skipped."
            echo "Syntax + standalone tests already passed in the php job."
            exit 0
          fi
          phpunit --bootstrap tests/wp-bootstrap.php tests/wp
